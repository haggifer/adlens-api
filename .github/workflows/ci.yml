name: CI

on:
    push:
        branches: [init-setup, main]
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run check:deps
            - run: npm run lint
            - run: npm run build
            - run: npm test
            - run: npm run test:e2e
            - run: npm run test:auth

    # Production deploy of a verified push to init-setup. Authenticates to Google Cloud through Workload Identity
    # Federation (GitHub's OIDC token, no stored key; the provider only accepts this repo on this branch), builds one
    # image and rolls both the worker job and the API to its digest. Env and secrets stay as infra/setup.sh set them.
    deploy:
        needs: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/init-setup'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        environment:
            name: production
            url: https://api.useadlens.com
        env:
            REGION: europe-west1
            IMAGE: europe-west1-docker.pkg.dev/adlens-ca57f/adlens/api
        steps:
            - uses: actions/checkout@v5
            - uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: projects/629217115736/locations/global/workloadIdentityPools/github/providers/adlens-api
                  service_account: adlens-deploy@adlens-ca57f.iam.gserviceaccount.com
            - uses: google-github-actions/setup-gcloud@v3
            - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
            - name: Build and push the image
              run: |
                  docker build --tag "$IMAGE:$GITHUB_SHA" .
                  docker push "$IMAGE:$GITHUB_SHA"
                  echo "IMAGE_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_ENV"
            # The worker first, so the API never launches a job on an older image than its own.
            - name: Deploy the analysis worker job
              run: gcloud run jobs update adlens-analyze --region "$REGION" --image "$IMAGE_REF"
            - name: Deploy the API
              run: gcloud run services update adlens-api --region "$REGION" --image "$IMAGE_REF"
            - name: Check the API is healthy
              run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://api.useadlens.com/health
